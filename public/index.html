<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Turquesa Hub: plataforma de gestión organizacional guiada para la prevención de las violencias basadas en género. Fundación Milagro de Abril.">
  <meta name="robots" content="noindex">
  <!--
    ENTORNO DE EJECUCIÓN: lo define js/env.js (config/env.desarrollo.js o config/env.produccion.js).
    El paquete de producción se genera con `node tools/build.js produccion` → dist/, que sustituye js/env.js,
    elimina el bloque dev:start…dev:end y excluye js/dev/. No editar este archivo a mano para desplegar.
  -->
  <title>Turquesa Hub · Sello Turquesa · Fundación Milagro de Abril</title>
  <!-- Identidad visual: Manual Maestro de Marca FMA 2026–2030 v1.1 (ver assets/branding/README.md).
       Favicon = isotipo oficial FMA (Turquesa Hub, activo de nivel 4, no tiene logo propio). -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/branding/fma-isotipo-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/branding/fma-isotipo-64.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/branding/fma-isotipo-180.png">
  <meta name="theme-color" content="#0B7F95">
  <!-- Tipografías institucionales (cap. 08): Poppins · Nunito Sans · Lora, cargadas desde su fuente oficial;
       sustitutas locales definidas en css/tokens.css. Si la política de datos exige evitar servicios de terceros,
       ingeniería puede alojarlas en assets/fonts (licencia OFL) y reemplazar estas tres líneas. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;1,400;1,500&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <a class="skip-link" href="#main">Ir al contenido principal</a>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>
  <noscript><div class="noscript">Turquesa Hub requiere JavaScript habilitado para funcionar.</div></noscript>

  <!-- Entorno y configuración -->
  <script src="js/env.js"></script>
  <script src="js/config.js"></script>
  <!-- Catálogos y contenido estructurado -->
  <script src="js/data/catalogos.js"></script>
  <script src="js/data/fuentes.js"></script>
  <script src="js/data/instrumento-diagnostico.js"></script>
  <script src="js/data/modulos-formativos.js"></script>
  <script src="js/data/contenidos.js"></script>
  <script src="js/data/documentos-legales.js"></script>
  <!-- dev:start --><!-- Datos de prueba: solo desarrollo; tools/build.js elimina este bloque. -->
  <script src="js/dev/semilla.js"></script>
  <!-- dev:end -->
  <!-- Núcleo -->
  <script src="js/state.js"></script>
  <script src="js/http.js"></script>
  <script src="js/vendor/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/mock-api.js"></script>
  <script src="js/remoto.js"></script>
  <script src="js/services/diagnostico.js"></script>
  <script src="js/services/plan-accion.js"></script>
  <script src="js/services/formacion.js"></script>
  <script src="js/services/sello.js"></script>
  <script src="js/services/reportes.js"></script>
  <!-- Componentes -->
  <script src="js/components/ui.js"></script>
  <script src="js/components/graficos.js"></script>
  <script src="js/components/layout.js"></script>
  <!-- Enrutador y vistas -->
  <script src="js/router.js"></script>
  <script src="js/views/public.js"></script>
  <script src="js/views/organization.js"></script>
  <script src="js/views/collaborator.js"></script>
  <script src="js/views/admin.js"></script>
  <!-- Los módulos reservados del proceso formal del Sello viven fuera de public/ (../reservado/) y no se despliegan. -->
  <script src="js/supabase.js"></script>
  <script src="js/admin-supabase.js"></script>
  <script src="js/org-supabase.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
