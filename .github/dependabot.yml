# Actualizaciones de dependencias (F05). Dependabot abre pull requests; la CI los prueba antes de aceptarlos.
version: 2
updates:
  - package-ecosystem: npm
    directory: /tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
