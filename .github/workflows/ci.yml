name: CI

# Pruebas del frontend (humo en desarrollo, integración en modo producción y paquete de producción).
# Corre en cada push a main y en pull requests; pages.yml la usa como paso previo a publicar.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo para el escaneo de secretos
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Escaneo de secretos (gitleaks, todo el historial)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner

      - name: Dependencias sin vulnerabilidades altas o críticas
        working-directory: tests
        run: |
          npm ci
          npm audit --audit-level=high

      # Incluye la prueba en navegador real (Chrome viene instalado en ubuntu-24.04).
      - name: Pruebas del frontend
        working-directory: tests
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm test
